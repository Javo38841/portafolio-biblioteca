# Publica el sitio en GitHub Pages en cada push a main.
# Corre en runners de GitHub (no en el self-hosted del homelab): el repo es público.
name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un solo despliegue a la vez; no se cancela uno en curso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Type-check y build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Instalar, verificar, compilar y subir artefacto
        uses: withastro/action@v6
        with:
          build-cmd: npm run check && npm run build

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
